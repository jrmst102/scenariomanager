<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN Verification — Scenario Planning Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-900">Scenario Planning Studio</h1>
                <p class="text-gray-500 mt-2">Enter your PIN to continue</p>
            </div>

            <div class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6" id="pin-error"></div>

            <form id="pin-form" class="space-y-6">
                <div>
                    <label for="pin" class="block text-sm font-medium text-gray-700 mb-1">4-Digit PIN</label>
                    <input type="password" id="pin" name="pin" required maxlength="4" pattern="\d{4}"
                           inputmode="numeric" autocomplete="off"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-center text-2xl tracking-widest">
                </div>
                <button type="submit"
                        class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition font-medium">
                    Verify PIN
                </button>
            </form>
        </div>
    </div>

    <script>
        const PROBLEM_ID = '{{ problem_id }}';
        const TOKEN = '{{ token }}';

        document.getElementById('pin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('pin-error');
            errorEl.classList.add('hidden');
            const pin = document.getElementById('pin').value;

            try {
                const res = await fetch(`/api/v1/participate/${PROBLEM_ID}/${TOKEN}/verify-pin`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({pin}),
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = data.redirect;
                } else {
                    errorEl.textContent = data.detail || 'Verification failed';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
