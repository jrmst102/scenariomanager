<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} — {{ message }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="text-center">
        <h1 class="text-6xl font-bold text-gray-300" id="error-code">{{ status_code }}</h1>
        <p class="text-xl text-gray-600 mt-4" id="error-message">{{ message }}</p>
        <p class="text-sm text-gray-400 mt-2 hidden" id="retry-status"></p>
        <a href="/problems" class="inline-block mt-8 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition font-medium">
            &larr; Back to Problems
        </a>
    </div>
    <script>
        // Smart retry for 404 on problem pages: poll API silently, reload only when ready
        (function() {
            const is404 = document.getElementById('error-code').textContent.trim() === '404';
            const match = window.location.pathname.match(/^\/problems\/([a-f0-9-]+)\//);
            if (!is404 || !match) return;

            const problemId = match[1];
            const statusEl = document.getElementById('retry-status');
            statusEl.classList.remove('hidden');
            statusEl.textContent = 'Waiting for storage sync...';

            let attempt = 0;
            const maxAttempts = 10;
            const interval = 2000;

            async function poll() {
                attempt++;
                if (attempt > maxAttempts) {
                    statusEl.textContent = 'Storage sync timed out. Please try refreshing.';
                    return;
                }
                statusEl.textContent = `Waiting for storage sync... (${attempt}/${maxAttempts})`;
                try {
                    const res = await fetch(`/api/v1/problems/${problemId}`);
                    if (res.ok) {
                        statusEl.textContent = 'Ready — reloading...';
                        window.location.reload();
                        return;
                    }
                } catch (e) { /* network error, keep polling */ }
                setTimeout(poll, interval);
            }
            setTimeout(poll, interval);
        })();
    </script>
</body>
</html>
